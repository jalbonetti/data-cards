const fmtPct=n=>n==null?'–':n.toFixed(1)+'%';
const raw=v=>{if(v==null)return '–';const s=String(v).trim();return s===''?'–':s;};
const fmtAvg=v=>{const n=parseFloat(v);return isNaN(n)?'–':(Math.abs(n)>=100?n.toFixed(0):n.toFixed(1));};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const abbrProp=v=>!v?'':(PROP_ABBR[v]||v);
const titleCase=s=>String(s).replace(/\b\w/g,c=>c.toUpperCase());
const capWx=w=>{const parts=String(w).split('|');if(parts.length)parts[parts.length-1]=titleCase(parts[parts.length-1].trim());return parts.map(x=>String(x).trim()).join(' | ');};
const fmtStamp=v=>{
  if(!v)return '';
  const s=String(v);
  const tm=s.match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
  const timePart=tm?`${parseInt(tm[1],10)}:${tm[2]} ${tm[3].toUpperCase()}`:'';
  const dm=s.match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/);
  let datePart='';
  if(dm){const mo=+dm[1],d=+dm[2];let y=dm[3]?(+dm[3]<100?2000+ +dm[3]:+dm[3]):null;
    const dow=(y!=null)?['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(y,mo-1,d).getDay()]:'';
    datePart=(dow?dow+' ':'')+mo+'/'+d;}
  const left=timePart?timePart+' ET':'';
  return datePart?(left?left+' · '+datePart:datePart):left;
};
const dayKeyOf=v=>{const dm=String(v||'').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(!dm)return null;return `${dm[3]}-${String(dm[1]).padStart(2,'0')}-${String(dm[2]).padStart(2,'0')}`;};
const dayLabelOf=k=>{if(!k)return '';const [y,m,d]=k.split('-').map(Number);return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(y,m-1,d).getDay()]+' '+m+'/'+d;};
const isYesNo=p=>/touchdown scorer/i.test(String(p||''));
function clrColors(p){if(p==null)return{edge:'var(--line)',bg:'rgba(255,255,255,.05)',fg:'#7a6b8f'};if(p<25)return{edge:'#f87171',bg:'rgba(248,113,113,.16)',fg:'#fca5a5'};if(p<40)return{edge:'#fb923c',bg:'rgba(251,146,60,.16)',fg:'#fdba74'};if(p<55)return{edge:'#fbbf24',bg:'rgba(251,191,36,.15)',fg:'#fcd34d'};if(p<70)return{edge:'#34d399',bg:'rgba(52,211,153,.16)',fg:'#6ee7b7'};return{edge:'#10b981',bg:'rgba(16,185,129,.24)',fg:'#34d399'};}

/* ---------- Data ---------- */
async function fetchPage(offset){const res=await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?select=*`,{headers:{apikey:ANON_KEY,Authorization:"Bearer "+ANON_KEY,Accept:"application/json",'Range-Unit':'items',Range:`${offset}-${offset+PAGE_SIZE-1}`}});if(!res.ok)throw new Error(`Supabase ${res.status}`);return res.json();}
async function fetchAll(){let out=[],offset=0;while(true){const rows=await fetchPage(offset);out=out.concat(rows);if(rows.length<PAGE_SIZE)break;offset+=PAGE_SIZE;}return out;}

/* ---------- Grouping: one card per player|prop|line ---------- */
function buildGroups(rows){
  const map=new Map();
  for(const row of rows){
    const player=row[F.player];if(!player)continue;
    const prop=row[F.prop],line=row[F.line],key=`${player}|${prop}|${line}`;
    let g=map.get(key);
    if(!g){
      g={key,player,team:row[F.team]||'',opp:row[F.opponent]||'',pos:row[F.pos]||'',prop,line:num(line),yn:isYesNo(prop),
        matchup:row[F.matchup]||'',gameTime:row[F.gameTime]||'',dayKey:dayKeyOf(row[F.gameTime]),
        spread:row[F.spread],total:row[F.total],stadium:row[F.stadium]||'',dome:row[F.dome]||'',
        wx:[row[F.wx1],row[F.wx2],row[F.wx3],row[F.wx4]].filter(w=>w!=null&&String(w).trim()!==''),
        medOver:oddsInt(row[F.medOver]),medUnder:oddsInt(row[F.medUnder]),
        bestOver:oddsInt(row[F.bestOver]),bestOverBk:row[F.bestOverBk]||'',bestUnder:oddsInt(row[F.bestUnder]),bestUnderBk:row[F.bestUnderBk]||'',
        variants:{},_q:String(player).toLowerCase()};
      map.set(key,g);
    }
    const vk=`${row[F.period]}|${row[F.split]}`;
    g.variants[vk]={clr:row[F.clearance]!=null&&row[F.clearance]!==''?num(String(row[F.clearance]).replace('%','')):null,
      gCleared:row[F.cleared]!=null&&row[F.cleared]!==''?parseInt(row[F.cleared],10):null,
      gTotal:row[F.games]!=null&&row[F.games]!==''?parseInt(row[F.games],10):null,
      avg:num(row[F.avg]),median:num(row[F.median]),high:num(row[F.high]),low:num(row[F.low]),
      oppAllowed:num(row[F.oppAllowed]),oppRank:num(row[F.oppRank]),
      oppAllowedPos:num(row[F.oppAllowedPos]),oppRankPos:num(row[F.oppRankPos])};
  }
  const arr=[...map.values()];
  GMAP.clear();
  for(const g of arr){
    const parts=String(g.matchup||'').split('@').map(x=>x.trim());
    g.location=parts.length===2?(parts[1]===g.team?'Home':(parts[0]===g.team?'Away':null)):null;
    g._season=g.variants['Full Season|All']||Object.values(g.variants)[0]||null;
    GMAP.set(g.key,g);
  }
  return arr;
}

function cellVar(g,period,sp){if(sp==='loc'){if(!g.location)return null;return g.variants[`${period}|${g.location}`]||null;}return g.variants[`${period}|${sp}`]||null;}
function clrVar(g,key){const [period,sp]=key.slice(4).split('|');return cellVar(g,period,sp);}
function activeClr(g){const v=clrVar(g,sortMode);return v?v.clr:null;}

/* ---------- Filters (multi-select, deselected-set semantics) ---------- */
function uniq(getter){return [...new Set(GROUPS.map(getter).filter(v=>v!=null&&v!==''))];}
const MS={};
function closeAllMS(){Object.values(MS).forEach(c=>{c.pop.hidden=true;c.btn.setAttribute('aria-expanded','false');});}
function buildMS(container,key){
  if(!container)return;
  container.innerHTML='';
  const btn=document.createElement('button');btn.type='button';btn.className='ms-btn';btn.setAttribute('aria-expanded','false');btn.textContent='All';
  const pop=document.createElement('div');pop.className='ms-pop';pop.hidden=true;
  container.appendChild(btn);container.appendChild(pop);
  const ctrl={key,btn,pop,options:[],
    syncLabel(){const ex=filters[key].size;btn.textContent=ex===0?'All':((ctrl.options.length-ex)+' selected');},
    setOptions(opts){
      const norm=opts.map(o=>Array.isArray(o)?o:[o,o]);
      ctrl.options=norm;
      const vals=new Set(norm.map(x=>String(x[0])));
      [...filters[key]].forEach(v=>{if(!vals.has(v))filters[key].delete(v);});
      pop.innerHTML='';
      const allBtn=document.createElement('button');allBtn.type='button';allBtn.className='ms-all';
      const syncAll=()=>{allBtn.textContent=filters[key].size===0?'Deselect all':'Select all';};
      allBtn.addEventListener('click',e=>{
        e.stopPropagation();
        if(filters[key].size===0){norm.forEach(x=>filters[key].add(String(x[0])));}else{filters[key].clear();}
        pop.querySelectorAll('input[type=checkbox]').forEach(cb=>{cb.checked=!filters[key].has(cb.value);});
        syncAll();ctrl.syncLabel();applyFilters();
      });
      pop.appendChild(allBtn);
      norm.forEach(([value,label])=>{
        const val=String(value);
        const row=document.createElement('label');row.className='ms-opt';
        const cb=document.createElement('input');cb.type='checkbox';cb.value=val;cb.checked=!filters[key].has(val);
        cb.addEventListener('change',()=>{if(cb.checked)filters[key].delete(val);else filters[key].add(val);syncAll();ctrl.syncLabel();applyFilters();});
        const span=document.createElement('span');span.textContent=label;
        row.appendChild(cb);row.appendChild(span);pop.appendChild(row);
      });
      syncAll();ctrl.syncLabel();
    }};
  btn.addEventListener('click',e=>{e.stopPropagation();const willOpen=pop.hidden;closeAllMS();pop.hidden=!willOpen;btn.setAttribute('aria-expanded',String(willOpen));});
  pop.addEventListener('click',e=>e.stopPropagation());
  MS[key]=ctrl;return ctrl;
}
filters=newFilters();
buildMS(document.querySelector('.ms[data-ms="day"]'),'day');
buildMS(document.querySelector('.ms[data-ms="team"]'),'team');
buildMS(document.querySelector('.ms[data-ms="pos"]'),'pos');
buildMS(document.querySelector('.ms[data-ms="prop"]'),'prop');
buildMS(document.querySelector('.ms[data-ms="line"]'),'line');
document.addEventListener('click',closeAllMS);

function populateFilters(){
  MS.day.setOptions(uniq(g=>g.dayKey).sort().map(k=>[k,dayLabelOf(k)]));
  MS.team.setOptions(uniq(g=>g.team).sort());
  MS.pos.setOptions(orderPos(uniq(g=>g.pos).filter(Boolean)));
  MS.prop.setOptions(orderProps(uniq(g=>g.prop)).map(v=>[v,abbrProp(v)]));
  MS.line.setOptions(uniq(g=>g.line).sort((a,b)=>a-b).map(v=>[String(v),String(v)]));
  document.querySelectorAll('input[data-filter]').forEach(el=>{const k=el.getAttribute('data-filter');el.value=(filters[k]!=null)?filters[k]:'';});
  els.search.value=filters.search||'';
}

function applySort(){
  const dir=sortDir==='asc'?1:-1;
  const metric=g=>{
    if(sortMetric==='bo')return g.bestOver;
    if(sortMetric==='bu')return g.bestUnder;
    if(sortMetric==='line')return g.line;
    if(sortMetric==='player')return null;
    return activeClr(g);
  };
  SORTED=GROUPS.slice().sort((a,b)=>{
    if(sortMetric==='player')return (a._q<b._q?-1:a._q>b._q?1:0)*(sortDir==='asc'?1:-1)*-1;
    const va=metric(a),vb=metric(b);
    if(va==null&&vb==null)return a._q<b._q?-1:1;
    if(va==null)return 1;if(vb==null)return -1;
    if(va!==vb)return (va-vb)*dir;
    return a._q<b._q?-1:1;
  });
}

function applyFilters(){
  applySort();
  const s=(filters.search||'').trim().toLowerCase();
  const gMin=filters.gMin!==''?num(filters.gMin):null;
  const cMin=filters.clrMin!==''?num(filters.clrMin):null;
  const boMin=filters.boMin!==''?num(filters.boMin):null,boMax=filters.boMax!==''?num(filters.boMax):null;
  const buMin=filters.buMin!==''?num(filters.buMin):null,buMax=filters.buMax!==''?num(filters.buMax):null;
  VIEW=SORTED.filter(g=>{
    if(s&&!g._q.includes(s))return false;
    if(g.dayKey&&filters.day.has(g.dayKey))return false;
    if(filters.team.has(g.team))return false;
    if(filters.pos.has(g.pos))return false;
    if(filters.prop.has(g.prop))return false;
    if(filters.line.has(String(g.line)))return false;
    if(gMin!=null&&gMin>0){const sv=cellVar(g,'Full Season','All');if(!sv||sv.gTotal==null||sv.gTotal<gMin)return false;}
    if(cMin!=null){const c=activeClr(g);if(c==null||c<cMin)return false;}
    if(boMin!=null&&(g.bestOver==null||g.bestOver<boMin))return false;
    if(boMax!=null&&(g.bestOver==null||g.bestOver>boMax))return false;
    if(buMin!=null&&(g.bestUnder==null||g.bestUnder<buMin))return false;
    if(buMax!=null&&(g.bestUnder==null||g.bestUnder>buMax))return false;
    return true;
  });
  rendered=0;els.grid.innerHTML='';els.grid.hidden=VIEW.length===0;els.count.textContent=VIEW.length.toLocaleString();
  if(VIEW.length===0){els.content.innerHTML='<div class="state"><h3>No matching props</h3><p>Loosen a filter — or if the board is empty, clearances appear as soon as books post player props.</p></div>';els.content.hidden=false;}
  else{els.content.hidden=true;fillViewport();}
  const active=CAT.reduce((n,k)=>n+(filters[k].size?1:0),0)+['clrMin','boMin','boMax','buMin','buMax'].filter(k=>filters[k]!=='').length+(filters.gMin!==''&&filters.gMin!=='0'?1:0);
  els.filterCount.hidden=active===0;els.filterCount.textContent=active;
}

/* ---------- Render ---------- */
function clrCell(g,key,label){
  const v=clrVar(g,key);const active=sortMetric==='clr'&&sortMode===key?' active':'';
  if(!v||v.clr==null)return `<div class="cell empty${active}"><div class="cl">${esc(label)}</div><div class="cv">–</div><div class="cg">&nbsp;</div></div>`;
  const c=clrColors(v.clr);
  return `<button type="button" class="cell${active}" data-sortkey="${key}" style="--cbg:${c.bg};--cfg:${c.fg}"><div class="cl">${esc(label)}</div><div class="cv">${fmtPct(v.clr)}</div><div class="cg">${v.gCleared??'–'}/${v.gTotal??'–'}</div></button>`;
}
function cardHTML(g){
  const posTag=g.pos?`<span class="tag lu proj">${esc(g.pos)}</span>`:'';
  const loc=g.location||'Loc';
  const av=clrVar(g,sortMetric==='clr'?sortMode:'clr:Full Season|All');
  const rail=clrColors(av?av.clr:null).edge;
  const betLine=g.yn?`${esc(abbrProp(g.prop))} <span class="side">Yes</span>`:`${esc(abbrProp(g.prop))} <span class="side">Over</span> ${g.line??''}`;
  return `
  <div class="card" data-key="${esc(g.key)}" style="--edge-c:${rail}">
    <div class="c-head">
      <div class="c-main"><div class="c-name">${esc(g.player)}</div>
        <div class="c-sub"><span class="tag">${esc(g.team)}</span> ${posTag} <span>${esc(g.matchup)}${g.gameTime?' · '+esc(fmtStamp(g.gameTime)):''}</span></div></div>
    </div>
    <div class="bet-line">${betLine}</div>
    <div class="cgrid">
      ${clrCell(g,'clr:Full Season|All','Season · All')}
      ${clrCell(g,'clr:Full Season|loc','Season · '+loc)}
      ${clrCell(g,'clr:Last 5 Games|All','L5 · All')}
      ${clrCell(g,'clr:Last 5 Games|loc','L5 · '+loc)}
    </div>
    <div class="odds">
      <div class="o"><div class="k">Best ${g.yn?'Yes':'Over'}</div><div class="v">${fmtOdds(g.bestOver)}</div><div class="b">${esc(g.bestOverBk||'')}</div></div>
      <div class="o"><div class="k">Median</div><div class="v">${fmtOdds(g.medOver)}</div><div class="b">${g.yn?'':'U '+fmtOdds(g.medUnder)}</div></div>
      <div class="o"><div class="k">Best ${g.yn?'No':'Under'}</div><div class="v">${fmtOdds(g.bestUnder)}</div><div class="b">${esc(g.bestUnderBk||'')}</div></div>
    </div>
    <div class="expand-row"><div class="matchup-mini">${g.location==='Home'?'vs':'@'} <b>${esc(g.opp||'—')}</b></div>
      <button class="exp-btn" type="button">Detail <span class="car">▾</span></button></div>
    <div class="detail"></div>
  </div>`;
}

/* ---------- Detail (lazy) ---------- */
function detailHTML(g){
  const yn=g.yn;
  const showPos=SHOW_VS_POS&&Object.values(g.variants).some(v=>v.oppAllowedPos!=null);
  const oppCell=(a,r)=>a!=null?(fmtAvg(a)+(r!=null?`&nbsp;<span style="color:var(--muted-2)">(#${r})</span>`:'')):'–';
  const rowFor=(label,period,sp)=>{
    const v=cellVar(g,period,sp);
    const cols=(yn?4:8)+(showPos?1:0);
    if(!v)return `<tr><td class="rl">${esc(label)}</td><td colspan="${cols-1}" style="color:var(--muted-2)">no games</td></tr>`;
    const clr=v.clr!=null?fmtPct(v.clr):'–';
    const posTd=showPos?`<td class="oa">${oppCell(v.oppAllowedPos,v.oppRankPos)}</td>`:'';
    if(yn)return `<tr><td class="rl">${esc(label)}</td><td>${clr}</td><td class="nw">${v.gCleared??'–'}/${v.gTotal??'–'}</td><td class="oa">${oppCell(v.oppAllowed,v.oppRank)}</td>${posTd}</tr>`;
    return `<tr><td class="rl">${esc(label)}</td><td>${clr}</td><td class="nw">${v.gCleared??'–'}/${v.gTotal??'–'}</td><td>${fmtAvg(v.avg)}</td><td>${fmtAvg(v.median)}</td><td>${raw(v.high)}</td><td>${raw(v.low)}</td><td class="oa">${oppCell(v.oppAllowed,v.oppRank)}</td>${posTd}</tr>`;
  };
  const loc=g.location||'Loc';
  const posTh=showPos?`<th>Opp vs ${esc(g.pos||'Pos')}</th>`:'';
  const head=yn
    ?`<tr><th></th><th>Clr%</th><th>Cleared</th><th>Opp Allowed</th>${posTh}</tr>`
    :`<tr><th></th><th>Clr%</th><th>Cleared</th><th>Avg</th><th>Med</th><th>High</th><th>Low</th><th>Opp Allowed</th>${posTh}</tr>`;
  const oppNote=(yn?"Opp Allowed = TDs per game the opponent gives up":"Opp Allowed = opponent's allowed per game for this stat")+
    ", period-matched and location-flipped. Rank 1 = fewest allowed."+(showPos?` "Opp vs ${esc(g.pos)}" = the slice given up to ${esc(g.pos)}s only.`:"");
  const spTxt=(g.spread!==''&&g.spread!=null)?(function(){const n=parseFloat(g.spread);return isNaN(n)?'–':(esc(g.team)+' '+(n>0?'+':'')+n);})():'–';
  const toTxt=(g.total!==''&&g.total!=null)?(function(){const n=parseFloat(g.total);return isNaN(n)?'–':('O/U '+n);})():'–';
  const domeYes=/^yes$/i.test(String(g.dome||'').trim())||String(g.wx[0]||'')==='Dome';
  const wxBody=domeYes
    ?`<div class="wx"><div>No Weather Data — Game Played in Dome</div></div>`
    :(g.wx.length?`<div class="wx">${g.wx.map(w=>`<div>${esc(capWx(w))}</div>`).join('')}</div>`:`<div class="wx"><div style="color:var(--muted-2)">No forecast yet</div></div>`);
  const envPanel=`<div class="panel"><div class="panel-h">Environment</div>
    <div class="kv"><span class="k">Spread</span><span class="v">${spTxt}</span><span class="k">Total</span><span class="v">${toTxt}</span>
    <span class="k">Stadium</span><span class="v">${esc(g.stadium||'–')}${/retract/i.test(String(g.dome))?' (Retractable)':(domeYes?' (Dome)':'')}</span></div>
    ${wxBody}</div>`;
  return `<div class="panel"><div class="panel-h">Clearance${yn?'':' & distribution'} — vs ${esc(g.opp||'—')}</div>
    <div class="mini-scroll"><table class="mini clr-detail${yn?' yn':''}"><thead>${head}</thead><tbody>
      ${rowFor('Season · All','Full Season','All')}
      ${rowFor('Season · '+loc,'Full Season','loc')}
      ${rowFor('L5 · All','Last 5 Games','All')}
      ${rowFor('L5 · '+loc,'Last 5 Games','loc')}
    </tbody></table></div>
    <div class="env-note">${oppNote}</div>
  </div>`+envPanel;
}

function renderMore(){if(rendered>=VIEW.length)return;const slice=VIEW.slice(rendered,rendered+BATCH);els.grid.insertAdjacentHTML('beforeend',slice.map(cardHTML).join(''));rendered+=slice.length;}
function fillViewport(){let guard=0;do{renderMore();guard++;}while(rendered<VIEW.length&&els.sentinel.getBoundingClientRect().top<window.innerHeight+700&&guard<50);}
const io=new IntersectionObserver(e=>{if(e[0].isIntersecting)fillViewport();},{rootMargin:'700px'});io.observe(els.sentinel);

/* ---------- Events ---------- */
els.grid.addEventListener('click',e=>{
  const cell=e.target.closest('.cell[data-sortkey]');
  if(cell){sortMetric='clr';els.sortSel.value='clr';sortMode=cell.getAttribute('data-sortkey');applyFilters();return;}
  const btn=e.target.closest('.exp-btn');
  if(btn){
    const card=btn.closest('.card');const det=card.querySelector('.detail');const g=GMAP.get(card.getAttribute('data-key'));
    const open=det.classList.toggle('open');
    btn.querySelector('.car').textContent=open?'▴':'▾';
    if(open&&!det.dataset.filled){det.innerHTML=detailHTML(g);det.dataset.filled='1';}
  }
});
els.search.addEventListener('input',()=>{filters.search=els.search.value;applyFilters();});
els.filterToggle.addEventListener('click',()=>{const open=els.filters.hidden;els.filters.hidden=!open;els.filterToggle.setAttribute('aria-expanded',String(open));});
els.clearFilters.addEventListener('click',()=>{filters=newFilters();populateFilters();Object.values(MS).forEach(c=>c.setOptions(c.options));applyFilters();});
document.querySelectorAll('input[data-filter]').forEach(el=>el.addEventListener('input',()=>{filters[el.getAttribute('data-filter')]=el.value;applyFilters();}));
els.sortSel.addEventListener('change',()=>{sortMetric=els.sortSel.value;applyFilters();});
els.sortDir.addEventListener('click',()=>{sortDir=sortDir==='desc'?'asc':'desc';els.sortDir.textContent=sortDir==='desc'?'▼':'▲';applyFilters();});

/* ---------- Boot + refresh ---------- */
let lastFetch=0;
async function load(force){
  if(!force&&Date.now()-lastFetch<CACHE_TTL)return;
  els.loadpill.hidden=false;els.loadpill.textContent='Loading…';
  try{
    const rows=await fetchAll();
    lastFetch=Date.now();
    GROUPS=buildGroups(rows);
    populateFilters();
    applyFilters();
    els.loadpill.hidden=true;
    if(GROUPS.length===0){els.content.innerHTML='<div class="state"><h3>No props on the board yet</h3><p>Clearances appear automatically as soon as books post player props.</p></div>';els.content.hidden=false;els.grid.hidden=true;}
  }catch(err){
    els.loadpill.hidden=true;
    if(GROUPS.length===0){els.content.innerHTML='<div class="state"><h3>Couldn&rsquo;t load data</h3><p>'+esc(err.message)+' — retrying shortly.</p></div>';els.content.hidden=false;}
  }
}
load(true);
setInterval(()=>load(false),CACHE_TTL+5000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load(false);});
})();
</script>
